services:
  db:
    image: postgres:15-alpine
    container_name: factline-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: factline
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d factline"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - factline-net
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: factline-qdrant
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "6333:6333"
    networks:
      - factline-net
    volumes:
      - qdrant_storage:/qdrant/storage

  ingestor:
    build: ./backend
    container_name: factline-ingestor
    command: ["python", "mass_ingest.py"]
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      DATA_CACHE_DIR: /data
    volumes:
      - liar_data:/data
    depends_on:
      qdrant:
        condition: service_started
    networks:
      - factline-net
    restart: on-failure

  backend:
    build: ./backend
    container_name: factline-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/factline
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - factline-net

  worker:
    build: ./backend
    container_name: factline-worker
    command: ["python", "worker.py"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/factline
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - factline-net

  redis:
    image: redis:7-alpine
    container_name: factline-redis
    ports:
      - "6379:6379"
    networks:
      - factline-net

networks:
  factline-net:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
  liar_data:
