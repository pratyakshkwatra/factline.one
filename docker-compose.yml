services:
  # Database for Intelligence Engine
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: factline_user
      POSTGRES_PASSWORD: factline_password
      POSTGRES_DB: factline_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factline_user -d factline_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Vector DB for Intelligence Engine
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Redis for Task Queues
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  # Intelligence Engine API
  api:
    build:
      context: ./intelligence-engine
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://factline_user:factline_password@postgres:5432/factline_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
